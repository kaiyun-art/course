<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>super cafeteria drink express - deluxe</title>
  <style>
    :root {
      --wood-dark: #3e2723;
      --wood-med: #5d4037;
      --wood-light: #8d6e63;
      --wood-accent: #a1887f;
      --counter-top: #d7ccc8;
      --primary-color: #ff6f61;
      --secondary-color: #4ecdc4;
      --dark-color: #2c3e50;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      background-color: #fff3e0;
      background-image: 
        radial-gradient(ellipse at top, rgba(255, 236, 179, 0.8) 0%, rgba(255, 204, 128, 0.3) 100%),
        repeating-linear-gradient(45deg, rgba(255, 224, 178, 0.2) 0, rgba(255, 224, 178, 0.2) 15px, transparent 0, transparent 30px);
    }

    /* 2D Cafeteria Counter Background */
    .cafeteria-container {
      width: 100%;
      max-width: 880px;
      border-radius: 25px 25px 15px 15px;
      border: 8px solid var(--wood-dark);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4), inset 0 2px 5px rgba(255,255,255,0.5);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: 
        radial-gradient(circle at 50% 20%, rgba(255,255,255,0.6) 0%, rgba(0,0,0,0.1) 80%),
        linear-gradient(to bottom, 
          #b2ebf2 0%, #b2ebf2 42%, 
          var(--wood-dark) 42%, var(--wood-dark) 44%, 
          var(--wood-light) 44%, var(--wood-med) 55%, 
          #eceff1 55%, #cfd8dc 58%, 
          var(--wood-med) 58%, var(--wood-dark) 100%
        );
    }

    .cafeteria-container::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 2px, transparent 2px, transparent 4px);
      pointer-events: none;
      z-index: 1;
    }

    .content-layer {
      position: relative;
      z-index: 2;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cafeteria-decor {
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 30px;
      pointer-events: none;
      opacity: 0.85;
    }

    .shelf-prop { width: 60px; height: 50px; }

    /* Header Bar */
    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.92);
      padding: 10px 24px;
      border-radius: 50px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
      border: 3px solid var(--wood-light);
    }

    h1 {
      color: var(--dark-color);
      margin: 0;
      font-size: 22px;
      text-shadow: 1px 1px #fff;
      text-transform: lowercase;
    }

    .stats {
      display: flex;
      gap: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .coin-count { color: #f39c12; }
    .star-count { color: #f1c40f; }

    /* Interactive Drink Display Stage */
    .drink-stage {
      height: 250px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin: 10px 0;
    }

    .tray-spotlight {
      position: absolute;
      width: 200px;
      height: 35px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 50%;
      bottom: 15px;
      filter: blur(5px);
    }

    .drink-wrapper {
      position: relative;
      cursor: pointer;
      z-index: 5;
    }

    .drink-svg {
      width: 200px;
      height: 220px;
      filter: drop-shadow(0 14px 12px rgba(0,0,0,0.3));
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Float & Wobble Animations */
    .float-anim {
      animation: gentleFloat 3.5s ease-in-out infinite;
    }

    .wobble-hover:hover {
      animation: wobble 0.6s ease-in-out infinite alternate;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-1.5deg); }
    }

    @keyframes wobble {
      0% { transform: rotate(-3deg) scale(1.05); }
      100% { transform: rotate(3deg) scale(1.08); }
    }

    @keyframes cheer {
      0% { transform: scale(1); }
      30% { transform: scale(1.2) rotate(-8deg); }
      60% { transform: scale(1.1) rotate(8deg); }
      100% { transform: scale(1); }
    }

    .cheer-anim { animation: cheer 0.8s ease; }

    /* Particles Base */
    .particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      z-index: 6;
    }

    @keyframes riseSteam {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-70px) scale(1.4); opacity: 0; }
    }
    .steam-particle {
      background: rgba(255, 255, 255, 0.75);
      filter: blur(3px);
      animation: riseSteam 2.2s infinite ease-out;
    }

    @keyframes riseBubble {
      0% { transform: translateY(0) scale(0.3); opacity: 0; }
      30% { opacity: 0.8; }
      100% { transform: translateY(-80px) scale(1); opacity: 0; }
    }
    .bubble-particle {
      border: 2px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.25);
      animation: riseBubble 1.8s infinite ease-in;
    }

    @keyframes sparkleGlow {
      0%, 100% { transform: scale(0.4) rotate(0deg); opacity: 0.1; }
      50% { transform: scale(1.2) rotate(180deg); opacity: 0.9; }
    }
    .sparkle-particle {
      background: #ffee58;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: sparkleGlow 1.5s infinite ease-in-out;
    }

    /* UI Cards */
    .game-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 16px 20px;
      margin-top: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      border: 2px solid var(--counter-top);
      text-align: center;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    button {
      background-color: var(--secondary-color);
      color: white;
      border: none;
      padding: 12px 14px;
      font-size: 16px;
      font-family: inherit;
      font-weight: bold;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 #39ac9a;
      transition: all 0.15s ease;
      text-transform: lowercase;
    }

    button:hover {
      background-color: #3bbfb6;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #39ac9a;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #39ac9a;
    }

    /* Writing Board */
    .writing-board-container {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      border: 5px dashed var(--primary-color);
      border-radius: 15px;
      background-color: #ffffff;
      cursor: crosshair;
      touch-action: none;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
      max-width: 100%;
    }

    .tools-bar {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      text-transform: lowercase;
    }

    .color-dot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }

    .color-dot:hover, .color-dot.active { transform: scale(1.25); }

    .btn-action { background-color: var(--primary-color); box-shadow: 0 4px 0 #d9534f; }
    .btn-action:hover { background-color: #e0564a; box-shadow: 0 6px 0 #d9534f; }

    .btn-submit { background-color: #2ec4b6; box-shadow: 0 4px 0 #219a8f; }
    .btn-submit:hover { background-color: #26ab9f; box-shadow: 0 6px 0 #219a8f; }

    #feedback {
      font-size: 20px;
      font-weight: bold;
      min-height: 32px;
      margin: 8px 0;
      text-transform: lowercase;
    }

    .correct { color: #2e7d32; }
    .incorrect { color: #c62828; }
  </style>
</head>
<body>

<div class="cafeteria-container">

        <div class="color-dot" style="background: #4ecdc4;" onclick="setPenColor('#4ecdc4', this)"></div>
        <div class="color-dot" style="background: #9b59b6;" onclick="setPenColor('#9b59b6', this)"></div>
        
        <button class="btn-action" onclick="clearCanvas()">eraser 🧹</button>

<script>
  // --- Web Audio Synthesizer ---
  const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSound(type) {
    if (AudioCtx.state === 'suspended') AudioCtx.resume();
    const osc = AudioCtx.createOscillator();
    const gain = AudioCtx.createGain();
    osc.connect(gain);
    gain.connect(AudioCtx.destination);
    const now = AudioCtx.currentTime;

    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
      osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.35);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      osc.start(now); osc.stop(now + 0.5);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.linearRampToValueAtTime(110, now + 0.25);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'draw') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(280 + Math.random() * 120, now);
      gain.gain.setValueAtTime(0.02, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.04);
      osc.start(now); osc.stop(now + 0.04);
    } else if (type === 'click') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'fanfare') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const o = AudioCtx.createOscillator();
        const g = AudioCtx.createGain();
        o.connect(g); g.connect(AudioCtx.destination);
        o.frequency.setValueAtTime(freq, now + idx * 0.08);
        g.gain.setValueAtTime(0.2, now + idx * 0.08);
        g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.25);
        o.start(now + idx * 0.08); o.stop(now + idx * 0.08 + 0.25);
      });
    }
  }

        <!-- Teabag Tag Hanging Out -->

        <ellipse cx="60" cy="40" rx="30" ry="8" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
        <!-- Glass Saucer Plate -->
        <ellipse cx="60" cy="126" rx="42" ry="7" fill="#ffffff" opacity="0.5" stroke="#b0bec5" stroke-width="1.5"/>
        <!-- Specular Highlight -->

    },
    {

    {
      name: "soy milk",
      particleType: "sparkle",
      svg: `<svg class="drink-svg" viewBox="0 0 120 140">
        <defs>
          <linearGradient id="cartonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#fffde7"/>
            <stop offset="60%" stop-color="#f0f4c3"/>
            <stop offset="100%" stop-color="#dce775"/>
          </linearGradient>
          <linearGradient id="cartonSide" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#c0ca33"/>

          </linearGradient>
        </defs>

  // --- Game State Variables ---
  let currentDrinkIndex = 0;
  let coins = 0;
  let stars = 0;
  let activePenColor = '#2c3e50';

  // --- DOM Elements ---
  const drinkSvgContainer = document.getElementById('drinkSvgContainer');
  const particleContainer = document.getElementById('particleContainer');
  const optionsGrid = document.getElementById('optionsGrid');
  const feedback = document.getElementById('feedback');
  const writingSection = document.getElementById('writingSection');
  const guessSection = document.getElementById('guessSection');
  const targetWord = document.getElementById('targetWord');
  const instruction = document.getElementById('instruction');

  // --- Writing Canvas Setup ---
  const canvas = document.getElementById('writingCanvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;

  function initCanvas() {
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      const r = canvas.getBoundingClientRect();
      startDrawing({ offsetX: t.clientX - r.left, offsetY: t.clientY - r.top });
    });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      const r = canvas.getBoundingClientRect();
      draw({ offsetX: t.clientX - r.left, offsetY: t.clientY - r.top });
    });
    canvas.addEventListener('touchend', stopDrawing);
  }

  function startDrawing(e) {
    isDrawing = true;
    ctx.strokeStyle = activePenColor;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
  }

  function draw(e) {
    if (!isDrawing) return;
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
    if (Math.random() < 0.35) playSound('draw');
  }

  function stopDrawing() { isDrawing = false; }

  function setPenColor(color, element) {
    playSound('click');
    activePenColor = color;
    document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
    element.classList.add('active');
  }

  function clearCanvas() {
    playSound('click');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGuidelinesAndTraceText();
  }

  function drawGuidelinesAndTraceText() {
    ctx.save();
    
    // Notebook guidelines
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, 45); ctx.lineTo(canvas.width, 45);
    ctx.moveTo(0, 135); ctx.lineTo(canvas.width, 135);
    ctx.stroke();

    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(0, 90); ctx.lineTo(canvas.width, 90);
    ctx.stroke();

    // Traceable text guide (Strictly Lowercase)
    ctx.setLineDash([]);
    ctx.font = 'bold 54px "Comic Sans MS", cursive';
    ctx.fillStyle = 'rgba(180, 180, 180, 0.38)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(drinks[currentDrinkIndex].name.toLowerCase(), canvas.width / 2, 95);

    ctx.restore();
  }

  // --- Visual Particle Effects System ---
  function spawnParticles(type) {
    particleContainer.innerHTML = '';
    const particleCount = type === 'sparkle' ? 5 : 6;

    for (let i = 0; i < particleCount; i++) {
      const p = document.createElement('div');
      p.className = `particle ${type}-particle`;
      
      const size = type === 'sparkle' ? 14 : Math.random() * 8 + 8;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      
      p.style.left = (Math.random() * 80 + 50) + 'px';
      p.style.top = (Math.random() * 40 + 20) + 'px';
      p.style.animationDelay = (Math.random() * 1.8) + 's';
      
      particleContainer.appendChild(p);
    }
  }

  function playDrinkSound() {
    playSound('click');
    const wrapper = document.getElementById('drinkWrapper');
    wrapper.classList.add('cheer-anim');
    setTimeout(() => wrapper.classList.remove('cheer-anim'), 800);
  }

  // --- Main Game Loop ---
  function loadRound() {
    const currentDrink = drinks[currentDrinkIndex];
    
    drinkSvgContainer.innerHTML = currentDrink.svg;
    spawnParticles(currentDrink.particleType);

    feedback.innerText = "";
    writingSection.style.display = "none";
    guessSection.style.display = "block";
    instruction.innerText = "step 1: choose the correct drink on the cafeteria counter!";

    clearCanvas();

    // Multiple Choice Options (Strictly Lowercase)
    optionsGrid.innerHTML = "";
    const shuffled = [...drinks].sort(() => 0.5 - Math.random());
    shuffled.forEach(drink => {
      const btn = document.createElement('button');
      btn.innerText = drink.name.toLowerCase();
      btn.onclick = () => checkGuess(drink.name.toLowerCase());
      optionsGrid.appendChild(btn);
    });
  }

  function checkGuess(selectedName) {
    const currentDrinkName = drinks[currentDrinkIndex].name.toLowerCase();

    if (selectedName === currentDrinkName) {
      playSound('correct');
      coins += 10;
      document.getElementById('coins').innerText = coins;

      feedback.innerText = `✨ correct! you picked the right drink! +10 coins 🪙`;
      feedback.className = "correct";

      const wrapper = document.getElementById('drinkWrapper');
      wrapper.classList.add('cheer-anim');

      setTimeout(() => {
        wrapper.classList.remove('cheer-anim');
        guessSection.style.display = "none";
        writingSection.style.display = "flex";
        targetWord.innerText = `"${currentDrinkName}"`;
        instruction.innerText = "step 2: trace and write the word on the board!";
      }, 1000);

    } else {
      playSound('wrong');
      feedback.innerText = "❌ oops! try another drink on the menu!";
      feedback.className = "incorrect";
    }
  }

  function submitWriting() {
    playSound('fanfare');
    stars += 1;
    document.getElementById('stars').innerText = stars;

    feedback.innerText = "🌟 great handwriting! you earned a star! 🌟";
    feedback.className = "correct";

    setTimeout(() => {
      currentDrinkIndex = (currentDrinkIndex + 1) % drinks.length;
      loadRound();
    }, 1200);
  }

  // --- Init ---
  window.onload = () => {
    initCanvas();
    loadRound();
  };
</script>
